name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Build Release APK & Bundle
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease bundleRelease --no-daemon

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/release/app-release.apk release_artifacts/DevBrowser-release.apk || true
          cp app/build/outputs/bundle/release/app-release.aab release_artifacts/DevBrowser-release.aab || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version_name }}
          name: Release ${{ github.ref_name || inputs.version_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_artifacts/DevBrowser-release.apk
            release_artifacts/DevBrowser-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
