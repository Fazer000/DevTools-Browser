name: Build Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Accept Android SDK licenses & Install Components
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure valid Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar

      - name: Setup Keystores and Properties
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating new debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug, O=Android, C=US"
          fi
          if [ -f "release.keystore.base64" ]; then
            echo "Restoring release.keystore from base64..."
            base64 -d release.keystore.base64 > release.keystore
          elif [ ! -f "release.keystore" ]; then
            echo "Generating new release.keystore..."
            keytool -genkey -v -keystore release.keystore -storepass releasepass -alias releasekey -keypass releasepass -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Release, OU=Development, O=App, L=San Francisco, ST=California, C=US"
          fi

          if [ ! -f "keystore.properties" ]; then
            echo "Creating keystore.properties..."
            echo "storeFile=release.keystore" > keystore.properties
            echo "storePassword=releasepass" >> keystore.properties
            echo "keyAlias=releasekey" >> keystore.properties
            echo "keyPassword=releasepass" >> keystore.properties
          fi

      - name: Calculate and set release version
        id: versioning
        run: |
          CURRENT_VERSION=$(grep -E 'versionName\s*=\s*"[^"]+"' app/build.gradle.kts | sed -E 's/.*versionName\s*=\s*"([^"]+)".*/\1/')
          if [ -z "$CURRENT_VERSION" ]; then
            CURRENT_VERSION="1.0.0"
          fi
          echo "Current app versionName in build.gradle.kts: $CURRENT_VERSION"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEW_VERSION_NAME}"
          echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "version_name=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Debug & Release APK / AAB
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: App-APKs
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag_name }}
          name: Release ${{ steps.versioning.outputs.tag_name }}
          draft: false
          prerelease: false
          overwrite: true
          make_latest: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

